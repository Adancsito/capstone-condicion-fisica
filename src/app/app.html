<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/" aria-label="Condición física, ir al inicio">
      <svg class="brand-mark" viewBox="0 0 34 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M2 17h30" />
        <path d="M5 17v-4M10 17v-2M15 17v-4M20 17v-2M25 17v-4M30 17v-2" />
        <path d="M17 2v8" stroke-width="3" />
      </svg>
      <span class="brand-text">Condición física</span>
    </a>
    <nav class="topnav" aria-label="Secciones">
      <a routerLink="/perfil" routerLinkActive="active">Mi perfil</a>
      @if (cloud.isInvestigator()) {
        <a routerLink="/investigador" routerLinkActive="active">Investigador</a>
      }
      @if (cloud.user() || !cloud.ready()) {
        <a routerLink="/cuenta" routerLinkActive="active">Cuenta</a>
      } @else {
        <a routerLink="/ingresar" routerLinkActive="active">Ingresar</a>
        <a routerLink="/registro" routerLinkActive="active">Registrarse</a>
      }
      <a routerLink="/acerca" routerLinkActive="active">Acerca</a>
    </nav>
  </div>
</header>
<router-outlet />
<app-pwa-banner />
<nav class="tabbar" aria-label="Secciones">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5" /><path d="M6 10v9h12v-9" /></svg>
    Inicio
  </a>
  <a routerLink="/perfil" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16a7.5 7.5 0 1 1 15 0" /><path d="M12 16l3.6-4.6" /><path d="M4 19.5h16" /></svg>
    Mi perfil
  </a>
  @if (cloud.isInvestigator()) {
    <a routerLink="/investigador" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5" /><path d="M9 4.5h6M9 11h6M9 15h4" /></svg>
      Sesiones
    </a>
  }
  @if (cloud.user() || !cloud.ready()) {
    <a routerLink="/cuenta" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" /><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" /></svg>
      Cuenta
    </a>
  } @else {
    <a routerLink="/ingresar" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" /><path d="M10 8l4 4-4 4" /><path d="M14 12H4" /></svg>
      Ingresar
    </a>
  }
  <a routerLink="/acerca" routerLinkActive="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5" /><path d="M12 8h.01" /></svg>
    Acerca
  </a>
</nav>
